<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArogyaBand Companion - Rural Health Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .app-container { width: 100%; max-width: 480px; background: #1e293b; border-radius: 24px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        
        /* Instagram-style Profile Header */
        .profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #334155; }
        .profile-pic { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #0284c7, #38bdf8); display: flex; align-items: center; justify-content: center; font-size: 28px; border: 2px solid #38bdf8; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }
        .profile-info h2 { font-size: 18px; font-weight: 700; color: #f8fafc; }
        .profile-info p { font-size: 12px; color: #94a3b8; margin-top: 2px; }
        .profile-tags { display: flex; gap: 8px; margin-top: 6px; }

        .card { background: #0f172a; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .badge-red { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .badge-green { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .badge-blue { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #38bdf8; }

        button { cursor: pointer; border: none; border-radius: 12px; padding: 12px 16px; font-weight: 600; font-size: 14px; transition: 0.2s; width: 100%; margin-top: 8px; }
        .btn-sos { background: #dc2626; color: white; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4); }
        .btn-sos:hover { background: #b91c1c; }
        .btn-primary { background: #0284c7; color: white; }
        .btn-primary:hover { background: #0369a1; }
        .btn-success { background: #16a34a; color: white; }

        .vitals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .vital-box { background: #1e293b; padding: 12px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
        .vital-value { font-size: 22px; font-weight: 700; color: #38bdf8; margin-top: 4px; }
        
        .pill-item { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 10px 14px; border-radius: 10px; margin-top: 8px; border: 1px solid #334155; font-size: 13px; }
        .chip { display: inline-block; background: #1e293b; color: #38bdf8; padding: 6px 12px; border-radius: 16px; font-size: 11px; margin-right: 6px; margin-top: 8px; cursor: pointer; border: 1px solid #334155; }
        .chip:hover { background: #334155; }
    </style>
</head>
<body>

            </div>
        </div>
