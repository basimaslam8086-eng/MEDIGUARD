<script>
    // State
    let currentLang = 'en-IN';
    let profile = JSON.parse(localStorage.getItem('mg_prof_v2')) || { name: "Grandma Mary", sector: "Perinjanam W-4" };
    let medicines = JSON.parse(localStorage.getItem('mg_meds_v2')) || [{ id: 1, name: "Atenolol 50mg", time: "Morning • 8:00 AM", taken: false }];
    let sosContacts = JSON.parse(localStorage.getItem('mg_sos_v2')) || [
        { name: "Family Primary Contact", phone: "+919847000000" },
        { name: "ASHA Health Worker", phone: "+919847111111" }
    ];

    // System Init
    document.addEventListener('DOMContentLoaded', () => {
        setupEventListeners();
        loadProfileData();
        renderMedicines();
        renderSOS();
    });

    function setupEventListeners() {
        // Profile Drawer
        document.getElementById('profile-toggle-btn').onclick = () => {
            const drawer = document.getElementById('settings-drawer');
            drawer.style.display = drawer.style.display === 'block' ? 'none' : 'block';
        };
        document.getElementById('close-drawer-btn').onclick = () => document.getElementById('settings-drawer').style.display = 'none';
        document.getElementById('save-profile-btn').onclick = saveProfile;

        // Languages
        document.getElementById('btn-lang-en').onclick = () => setLang('en-IN');
        document.getElementById('btn-lang-hi').onclick = () => setLang('hi-IN');
        document.getElementById('btn-lang-ml').onclick = () => setLang('ml-IN');

        // Form buttons
        document.getElementById('add-med-btn').onclick = addMedicine;
        document.getElementById('add-sos-btn').onclick = addSOS;
        document.getElementById('trigger-sos-btn').onclick = triggerSOSCall;
        document.getElementById('ask-ai-btn').onclick = runAI;
        document.getElementById('mic-btn').onclick = startVoice;
        document.getElementById('spike-btn').onclick = simulateSpike;
        document.getElementById('ble-btn').onclick = pairBLE;
    }

    // Language Engine
    function setLang(code) {
        currentLang = code;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        if(code === 'en-IN') {
            document.getElementById('btn-lang-en').classList.add('active');
            document.getElementById('lang-tag').innerText = "English";
        } else if(code === 'hi-IN') {
            document.getElementById('btn-lang-hi').classList.add('active');
            document.getElementById('lang-tag').innerText = "हिंदी";
        } else if(code === 'ml-IN') {
            document.getElementById('btn-lang-ml').classList.add('active');
            document.getElementById('lang-tag').innerText = "മലയാളം";
        }
    }

    // Profile Management
    function loadProfileData() {
        document.getElementById('display-name').innerText = profile.name;
        document.getElementById('edit-name').value = profile.name;
        document.getElementById('edit-sector').value = profile.sector;
    }

    function saveProfile() {
        profile.name = document.getElementById('edit-name').value || "Grandma Mary";
        profile.sector = document.getElementById('edit-sector').value || "Sector 1";
        localStorage.setItem('mg_prof_v2', JSON.stringify(profile));
        document.getElementById('display-name').innerText = profile.name;
        document.getElementById('settings-drawer').style.display = 'none';
        alert("Profile saved successfully!");
    }

    // Medicines
    function renderMedicines() {
        const list = document.getElementById('meds-list');
        list.innerHTML = '';
        let pending = 0;
        medicines.forEach((m, idx) => {
            if(!m.taken) pending++;
            const row = document.createElement('div');
            row.className = 'list-row';
            row.innerHTML = `
                <div>
                    <b style="${m.taken ? 'text-decoration:line-through; color:var(--text-muted);':''}">${m.name}</b><br>
                    <span style="font-size:10px; color:var(--text-muted);">⏰ ${m.time}</span>
                </div>
                <div>
                    <button class="btn-sm ${m.taken ? 'btn-action':'btn-take'}" onclick="toggleMed(${idx})">${m.taken ? 'Done ✓':'Take'}</button>
                    <button class="btn-sm btn-del" onclick="delMed(${idx})">✕</button>
                </div>
            `;
            list.appendChild(row);
        });
        document.getElementById('pill-badge').innerText = pending + " Pending";
        localStorage.setItem('mg_meds_v2', JSON.stringify(medicines));
    }

    function addMedicine() {
        const name = document.getElementById('med-name-in').value;
        const time = document.getElementById('med-time-in').value;
        if(!name) return alert("Please enter medicine name.");
        medicines.push({ id: Date.now(), name, time: time || "Daily", taken: false });
        document.getElementById('med-name-in').value = '';
        document.getElementById('med-time-in').value = '';
        renderMedicines();
    }

    window.toggleMed = function(i) { medicines[i].taken = !medicines[i].taken; renderMedicines(); };
    window.delMed = function(i) { medicines.splice(i, 1); renderMedicines(); };

    // SOS Contacts
    function renderSOS() {
        const preview = document.getElementById('sos-preview-list');
        const manage = document.getElementById('sos-manage-list');
        preview.innerHTML = '';
        manage.innerHTML = '';

        sosContacts.forEach((c, i) => {
            const pRow = document.createElement('div');
            pRow.className = 'list-row';
            pRow.innerHTML = <span>📞 <b>${c.name}</b> (${c.phone})</span>;
            preview.appendChild(pRow);

            const mRow = document.createElement('div');
            mRow.className = 'list-row';
            mRow.innerHTML = <span><b>${c.name}</b>: ${c.phone}</span><button class="btn-sm btn-del" onclick="delSOS(${i})">✕</button>;
            manage.appendChild(mRow);
        });
        document.getElementById('sos-badge').innerText = sosContacts.length + " Contacts";
        localStorage.setItem('mg_sos_v2', JSON.stringify(sosContacts));
    }

    function addSOS() {
        const name = document.getElementById('new-sos-name').value;
        const phone = document.getElementById('new-sos-phone').value;
        if(!name || !phone) return alert("Enter contact name and number.");
        sosContacts.push({ name, phone });
        document.getElementById('new-sos-name').value = '';
        document.getElementById('new-sos-phone').value = '';
        renderSOS();
    }

    window.delSOS = function(i) {
        if(sosContacts.length <= 1) return alert("At least 1 SOS contact is required.");
        sosContacts.splice(i, 1);
        renderSOS();
    };

    function triggerSOSCall() {
        if(sosContacts.length === 0) return;
        const target = sosContacts[0];
        if(confirm(🚨 EMERGENCY SOS DISPATCH!\nCalling primary contact: ${target.name} (${target.phone}))) {
            window.location.href = tel:${target.phone};
        }
    }

    // --- ENHANCED VOICE & AI ENGINE ---

    function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        
        window.speechSynthesis.cancel(); // Clear queued audio
        
        const ut = new SpeechSynthesisUtterance(text);
        ut.lang = currentLang;
        ut.rate = 0.85; // Slightly slower for elderly clarity
        ut.volume = 1.0;

        // Force voice selection if available
        const voices = window.speechSynthesis.getVoices();
        const matchingVoice = voices.find(v => v.lang.startsWith(currentLang.split('-')[0]));
        if (matchingVoice) ut.voice = matchingVoice;

        window.speechSynthesis.speak(ut);
    }

    function startVoice() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Voice input is not supported in this browser mode. Please try typing your question or use standard Chrome.");
            return;
        }

        const rec = new SpeechRecognition();
        rec.lang = currentLang;
        rec.continuous = false;
        rec.interimResults = false;

        const inputField = document.getElementById('ai-input');
        inputField.placeholder = "Listening... Speak now...";

        rec.onresult = (e) => {
            const spokenText = e.results[0][0].transcript;
            inputField.value = spokenText;
            runAI();
        };

        rec.onerror = (err) => {
            console.error("Speech Error:", err);
            inputField.placeholder = "Ask health question or speak...";
            if (err.error === 'not-allowed') {
                alert("Microphone permission was denied. Please allow microphone access in Chrome settings.");
            }
        };

        rec.onend = () => {
            inputField.placeholder = "Ask health question or speak...";
        };

        try {
            rec.start();
        } catch (ex) {
            console.error("Mic start error:", ex);
        }
    }

    function runAI() {
        const inputField = document.getElementById('ai-input');
        const q = inputField.value.trim().toLowerCase();
        const out = document.getElementById('ai-output');
        let res = "";

        if (!q) {
            res = currentLang === 'hi-IN' ? "कृपया अपना प्रश्न लिखें या बोलें।" : 
                  (currentLang === 'ml-IN' ? "ദയവായി ചോദ്യം ചോദിക്കുക." : "Please type or speak your health question.");
            out.innerText = "🤖 " + res;
            speakText(res);
            return;
        }

        // Knowledge Base Logic
        if (currentLang === 'hi-IN') {
            if (q.includes('चक्कर') || q.includes('dizzy') || q.includes('dizziness')) {
                res = "मरीज को तुरंत छांव में बिठाएं और पानी की घूंट दें। यदि चक्कर बना रहे तो लाल एसओएस बटन दबाएं।";
            } else if (q.includes('दवा') || q.includes('pill') || q.includes('missed')) {
                res = "छूटी हुई दवा याद आते ही लें। यदि अगली खुराक का समय करीब है तो दोहरी खुराक न लें।";
            } else if (q.includes('बीपी') || q.includes('bp') || q.includes('blood pressure')) {
                res = "सामान्य बीपी 120/80 होता है। यदि बीपी 140/90 से अधिक रहे तो डॉक्टर से संपर्क करें।";
            } else {
                res = "प्रश्न दर्ज कर लिया गया है। मरीज को शांत और हवादार जगह पर रखें। परेशानी होने पर स्वास्थ्य कार्यकर्ता को कॉल करें।";
            }
        } else if (currentLang === 'ml-IN') {
            if (q.includes('തലചുറ്റൽ') || q.includes('dizzy') || q.includes('dizziness')) {
                res = "രോഗിയെ ഉടൻ തണലിൽ ഇരുത്തി വെള്ളം നൽകുക. തലചുറ്റൽ തുടരുകയാണെങ്കിൽ SOS ബട്ടൺ അമർത്തുക.";
            } else if (q.includes('മരുന്ന്') || q.includes('pill') || q.includes('missed')) {
                res = "വിട്ടുപോയ മരുന്ന് ഓർമ്മവരുമ്പോൾ കഴിക്കുക. അടുത്ത മരുന്നിന്റെ സമയമായെങ്കിൽ ഇരട്ടി ഡോസ് കഴിക്കരുത്.";
            } else if (q.includes('ബിപി') || q.includes('bp') || q.includes('blood pressure')) {
                res = "സാധാരണ ബിപി 120/80 ആണ്. ബിപി ഉയർന്നാൽ ഉടൻ ആശാ വർക്കറെ ബന്ധപ്പെടുക.";
            } else {
                res = "ചോദ്യം സ്വീകരിച്ചു. രോഗിയെ ശാന്തമായി ഇരുത്തുക, ആവശ്യമെങ്കിൽ പ്രാഥമിക ആരോഗ്യ കേന്ദ്രവുമായി ബന്ധപ്പെടുക.";
            }
        } else {
            if (q.includes('dizzy') || q.includes('dizziness') || q.includes('faint')) {
                res = "Assist the patient to sit or lie down in a shaded area and sip water. If dizzy spells persist, dispatch the SOS call.";
            } else if (q.includes('missed') || q.includes('pill') || q.includes('medication')) {
                res = "Take missed medication as soon as remembered. If it is almost time for the next scheduled dose, skip the missed one. Never double doses.";
            } else if (q.includes('bp') || q.includes('blood pressure') || q.includes('high')) {
                res = "Normal resting Blood Pressure is around 120/80. Readings consistently above 140/90 require consultation with your primary health worker.";
            } else {
                res = "Health query processed. Keep the patient calm and hydrated. Contact your local health center if symptoms persist.";
            }
        }

        out.innerText = "🤖 " + res;
        speakText(res);
    }

    function simulateSpike() {
        document.getElementById('hr-display').innerText = "148 BPM";
        document.getElementById('bp-display').innerText = "165/105";
        document.getElementById('vitals-badge').innerText = "CRITICAL";
        document.getElementById('vitals-badge').className = "badge badge-red";
        
        let alertMsg = currentLang === 'hi-IN' ? "चेतावनी! उच्च रक्तचाप का पता चला!" : 
                      (currentLang === 'ml-IN' ? "മുന്നറിയിപ്പ്! ഉയർന്ന രക്തസമ്മർദ്ദം കണ്ടെത്തി!" : "Warning! Critical Blood Pressure spike detected!");
        
        document.getElementById('ai-output').innerText = "⚠️ " + alertMsg;
        speakText(alertMsg);
        alert(alertMsg);
    }

    async function pairBLE() {
        try {
            const d = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
            alert("Paired with: " + d.name);
        } catch(e) { alert("Bluetooth scan canceled."); }
    }
</script>
