<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEDIGUARD - Rural Care System</title>
    <style>
        :root {
            --bg-main: #0B1120;
            --card-bg: #1E293B;
            --card-border: #334155;
            --accent-blue: #38BDF8;
            --accent-green: #22C55E;
            --accent-red: #EF4444;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            padding: 12px; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
        }
        
        .app-container { 
            width: 100%; 
            max-width: 460px; 
            background: #0F172A; 
            border-radius: 24px; 
            padding: 16px; 
            border: 1px solid var(--card-border); 
        }

        /* Header */
        .brand-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
            padding-bottom: 10px; 
            border-bottom: 1px solid var(--card-border); 
        }
        .brand-title { font-size: 20px; font-weight: 800; color: #FFF; }
        .brand-title span { color: var(--accent-blue); }
        
        .profile-chip { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            background: #1E293B; 
            border: 1.5px solid var(--accent-blue); 
            padding: 8px 14px; 
            border-radius: 20px; 
            cursor: pointer; 
        }
        .profile-name { font-size: 12px; font-weight: 700; color: #E2E8F0; }

        /* Settings Card */
        .settings-card { 
            display: none; 
            background: #1E293B; 
            border-radius: 16px; 
            padding: 14px; 
            margin-bottom: 14px; 
            border: 1.5px solid var(--accent-blue); 
        }
        .drawer-title { 
            font-size: 13px; 
            font-weight: 800; 
            color: var(--accent-blue); 
            margin-bottom: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        /* Language Switcher */
        .lang-bar { display: flex; gap: 6px; margin-bottom: 12px; }
        .lang-btn { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid var(--card-border); 
            border-radius: 10px; 
            background: #1E293B; 
            color: var(--text-muted); 
            font-size: 12px; 
            font-weight: 700; 
            cursor: pointer; 
        }
        .lang-btn.active { 
            background: var(--accent-blue); 
            color: #000; 
            border-color: var(--accent-blue); 
        }

        /* Cards */
        .card { 
            background: #1E293B; 
            border-radius: 18px; 
            padding: 14px; 
            margin-bottom: 12px; 
            border: 1px solid var(--card-border); 
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card-title { font-size: 13px; font-weight: 700; color: #E2E8F0; }

        .badge { padding: 4px 8px; border-radius: 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .badge-green { background: rgba(34, 197, 94, 0.2); color: #4ADE80; }
        .badge-blue { background: rgba(56, 189, 248, 0.2); color: var(--accent-blue); }
        .badge-red { background: rgba(239, 68, 68, 0.2); color: #F87171; }

        /* Vitals Grid */
        .vitals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .vital-box { background: #0F172A; padding: 10px; border-radius: 12px; text-align: center; border: 1px solid var(--card-border); }
        .vital-val { font-size: 22px; font-weight: 800; color: var(--accent-blue); margin-top: 2px; }

        /* Form Inputs & Touch Buttons */
        .form-input { 
            width: 100%; 
            padding: 12px; 
            background: #0F172A; 
            border: 1px solid var(--card-border); 
            border-radius: 8px; 
            color: white; 
            font-size: 13px; 
            margin-top: 6px; 
            outline: none; 
        }

        .btn { 
            width: 100%; 
            border: none; 
            border-radius: 12px; 
            padding: 14px; 
            font-size: 13px; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 8px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 6px; 
        }
        .btn:active { transform: scale(0.97); }
        .btn-sos { background: linear-gradient(135deg, #DC2626, #EF4444); color: white; }
        .btn-action { background: #334155; color: white; }
        .btn-voice { background: var(--accent-blue); color: #000; }

        /* Dynamic Lists */
        .list-row { display: flex; justify-content: space-between; align-items: center; background: #0F172A; padding: 10px; border-radius: 10px; margin-top: 6px; border: 1px solid var(--card-border); font-size: 12px; }
        .btn-sm { padding: 8px 12px; font-size: 11px; border-radius: 6px; border: none; cursor: pointer; font-weight: 700; }
        .btn-take { background: var(--accent-green); color: white; }
        .btn-del { background: rgba(239, 68, 68, 0.2); color: #F87171; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="brand-bar">
            <div class="brand-title">🛡️ MEDI<span>GUARD</span></div>
            <div class="profile-chip" id="btn-profile-toggle">
                <span>👵</span>
                <span class="profile-name" id="display-name">Grandma Mary</span>
                <span style="font-size:10px;">⚙️</span>
            </div>
        </div>

        <!-- Inline Settings Card -->
        <div class="settings-card" id="settings-card">
            <div class="drawer-title">
                <span>⚙️ Patient Profile & API Settings</span>
                <button class="btn-sm btn-del" id="btn-close-settings">Close ✕</button>
            </div>
            
            <label style="font-size: 10px; color: var(--text-muted); font-weight: 700;">PATIENT NAME</label>
            <input type="text" id="edit-name" class="form-input" value="Grandma Mary">
            
            <label style="font-size: 10px; color: var(--text-muted); font-weight: 700; margin-top: 6px; display: block;">GEMINI API KEY (Optional for Cloud AI)</label>
            <input type="password" id="edit-api-key" class="form-input" placeholder="Paste AI Studio key here...">

            <button class="btn btn-action" style="background: var(--accent-green); color: white;" id="btn-save-profile">Save Settings</button>

            <div style="border-top: 1px solid var(--card-border); margin-top: 10px; padding-top: 8px;">
                <label style="font-size: 10px; color: var(--text-muted); font-weight: 700;">ADD EMERGENCY SOS CONTACT</label>
                <input type="text" id="new-sos-name" class="form-input" placeholder="Contact Name (e.g. Son / ASHA)">
                <input type="text" id="new-sos-phone" class="form-input" placeholder="Phone Number">
                <button class="btn btn-action" style="background: var(--accent-blue); color: black;" id="btn-add-sos">+ Add Contact</button>
                <div id="sos-manage-list" style="margin-top: 8px;"></div>
            </div>
        </div>

        <!-- Language Switcher -->
        <div class="lang-bar">
            <button class="lang-btn active" id="btn-lang-en">English</button>
            <button class="lang-btn" id="btn-lang-hi">हिंदी</button>
            <button class="lang-btn" id="btn-lang-ml">മലയാളം</button>
        </div>

        <!-- Vitals Monitoring -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">❤️ Continuous Vitals (BLE Band)</div>
                <span class="badge badge-green" id="vitals-badge">Normal</span>
            </div>
            <div class="vitals-grid">
                <div class="vital-box">
                    <span style="font-size: 10px; color: var(--text-muted);">Pulse Rate</span>
                    <div class="vital-val" id="hr-display">72 <span style="font-size:11px;">BPM</span></div>
                </div>
                <div class="vital-box">
                    <span style="font-size: 10px; color: var(--text-muted);">Blood Pressure</span>
                    <div class="vital-val" id="bp-display">120/80</div>
                </div>
            </div>
            <div style="display: flex; gap: 6px; margin-top: 8px;">
                <button class="btn btn-action" style="flex:1;" id="btn-ble">📡 Pair Band</button>
                <button class="btn btn-action" style="flex:1; background: rgba(239, 68, 68, 0.2); color: #F87171;" id="btn-spike">⚠️ Test Spike</button>
            </div>
        </div>

        <!-- Medicine Schedule -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">💊 Medication Reminders</div>
                <span class="badge badge-blue" id="pill-badge">0 Pending</span>
            </div>
            <div id="meds-list"></div>
            <div style="margin-top: 8px; border-top: 1px solid var(--card-border); padding-top: 8px;">
                <input type="text" id="med-name-in" class="form-input" placeholder="Medicine Name (e.g. Paracetamol)">
                <input type="text" id="med-time-in" class="form-input" placeholder="Time (e.g. Morning)">
                <button class="btn btn-action" style="background: var(--accent-blue); color: #000;" id="btn-add-med">+ Add Medicine</button>
            </div>
        </div>

        <!-- SOS Gateway -->
        <div class="card" style="border-color: rgba(239, 68, 68, 0.4);">
            <div class="card-header">
                <div class="card-title" style="color: #F87171;">🚨 Emergency SOS Gateway</div>
                <span class="badge badge-red" id="sos-badge">Contacts</span>
            </div>
            <div id="sos-preview-list"></div>
            <button class="btn btn-sos" id="btn-trigger-sos">DISPATCH SOS CALL</button>
        </div>

        <!-- AI Assistant -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">🤖 Health Advisor AI</div>
                <span class="badge badge-blue" id="lang-tag">English</span>
            </div>
            <input type="text" id="ai-input" class="form-input" placeholder="Ask health question or type 'fever'...">
            <div style="display: flex; gap: 6px; margin-top: 6px;">
                <button class="btn btn-voice" style="flex: 1;" id="btn-mic">🎙️ Speak</button>
                <button class="btn btn-action" style="flex: 1;" id="btn-ask-ai">Ask AI</button>
            </div>
            <div id="ai-output" style="font-size: 11px; color: var(--accent-blue); margin-top: 8px; line-height: 1.4; font-weight: 600; background: #0F172A; padding: 10px; border-radius: 8px; min-height: 36px;">
                🤖 AI Response will appear here...
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'en-IN';
        let profile = { name: "Grandma Mary", apiKey: "" };
        let medicines = [{ id: 1, name: "Atenolol 50mg", time: "Morning • 8:00 AM", taken: false }];
        let sosContacts = [
            { name: "Family Primary Contact", phone: "+919847000000" },
            { name: "ASHA Health Worker", phone: "+919847111111" }
        ];

        // Guaranteed Touch Binder (Hardware-Tested)
        function bindTouch(elementId, actionFn) {
            const el = document.getElementById(elementId);
            if(!el) return;
            el.addEventListener('touchstart', function(e) {
                e.preventDefault();
                actionFn();
            }, {passive: false});
            el.addEventListener('click', actionFn);
        }

        window.addEventListener('load', function() {
            bindTouch('btn-profile-toggle', toggleSettings);
            bindTouch('btn-close-settings', toggleSettings);
            bindTouch('btn-save-profile', saveProfile);

            bindTouch('btn-lang-en', function() { setLang('en-IN'); });
            bindTouch('btn-lang-hi', function() { setLang('hi-IN'); });
            bindTouch('btn-lang-ml', function() { setLang('ml-IN'); });

            bindTouch('btn-add-med', addMedicine);
            bindTouch('btn-add-sos', addSOS);
            bindTouch('btn-trigger-sos', triggerSOSCall);
            bindTouch('btn-ask-ai', processAIRequest);
            bindTouch('btn-mic', startVoice);
            bindTouch('btn-spike', simulateSpike);
            bindTouch('btn-ble', pairBLE);

            try {
                const savedKey = localStorage.getItem('mg_gemini_key');
                if(savedKey) {
                    profile.apiKey = savedKey;
                    document.getElementById('edit-api-key').value = savedKey;
                }
            } catch(e) {}

            renderMedicines();
            renderSOS();
        });

        function toggleSettings() {
            const card = document.getElementById('settings-card');
            card.style.display = (card.style.display === 'block') ? 'none' : 'block';
        }

        function saveProfile() {
            profile.name = document.getElementById('edit-name').value || "Grandma Mary";
            profile.apiKey = document.getElementById('edit-api-key').value.trim();
            try { localStorage.setItem('mg_gemini_key', profile.apiKey); } catch(e) {}
            document.getElementById('display-name').innerText = profile.name;
            document.getElementById('settings-card').style.display = 'none';
            alert("Settings saved!");
        }

        function setLang(code) {
            currentLang = code;
            document.getElementById('btn-lang-en').classList.remove('active');
            document.getElementById('btn-lang-hi').classList.remove('active');
            document.getElementById('btn-lang-ml').classList.remove('active');

            if(code === 'en-IN') {
                document.getElementById('btn-lang-en').classList.add('active');
                document.getElementById('lang-tag').innerText = "English";
            } else if(code === 'hi-IN') {
                document.getElementById('btn-lang-hi').classList.add('active');
                document.getElementById('lang-tag').innerText = "हिंदी";
            } else if(code === 'ml-IN') {
                document.getElementById('btn-lang-ml').classList.add('active');
                document.getElementById('lang-tag').innerText = "മലയാളം";
            }
        }

        function renderMedicines() {
            const list = document.getElementById('meds-list');
            list.innerHTML = '';
            let pending = 0;

            medicines.forEach((m, idx) => {
                if(!m.taken) pending++;
                const row = document.createElement('div');
                row.className = 'list-row';
                row.innerHTML = `
                    <div>
                        <b style="${m.taken ? 'text-decoration:line-through; color:var(--text-muted);':''}">${m.name}</b><br>
                        <span style="font-size:10px; color:var(--text-muted);">⏰ ${m.time}</span>
                    </div>
                    <div id="med-actions-${idx}"></div>
                `;
                list.appendChild(row);

                const actionContainer = document.getElementById(med-actions-${idx});
                
                const btnTake = document.createElement('button');
                btnTake.className = btn-sm ${m.taken ? 'btn-action':'btn-take'};
                btnTake.innerText = m.taken ? 'Done ✓':'Take';
                btnTake.ontouchstart = (e) => { e.preventDefault(); toggleMed(idx); };
                btnTake.onclick = () => toggleMed(idx);

                const btnDel = document.createElement('button');
                btnDel.className = 'btn-sm btn-del';
                btnDel.style.marginLeft = '4px';
                btnDel.innerText = '✕';
                btnDel.ontouchstart = (e) => { e.preventDefault(); delMed(idx); };
                btnDel.onclick = () => delMed(idx);

                actionContainer.appendChild(btnTake);
                actionContainer.appendChild(btnDel);
            });
            document.getElementById('pill-badge').innerText = pending + " Pending";
        }

        function addMedicine() {
            const name = document.getElementById('med-name-in').value.trim();
            const time = document.getElementById('med-time-in').value.trim();
            if(!name) return alert("Please enter medicine name.");
            medicines.push({ id: Date.now(), name: name, time: time || "Daily", taken: false });
            document.getElementById('med-name-in').value = '';
            document.getElementById('med-time-in').value = '';
            renderMedicines();
        }

        function toggleMed(i) { medicines[i].taken = !medicines[i].taken; renderMedicines(); }
        function delMed(i) { medicines.splice(i, 1); renderMedicines(); }

        function renderSOS() {
            const preview = document.getElementById('sos-preview-list');
            const manage = document.getElementById('sos-manage-list');
            preview.innerHTML = '';
            manage.innerHTML = '';

            sosContacts.forEach((c, i) => {
                const pRow = document.createElement('div');
                pRow.className = 'list-row';
                pRow.innerHTML = <span>📞 <b>${c.name}</b> (${c.phone})</span>;
                preview.appendChild(pRow);

                const mRow = document.createElement('div');
                mRow.className = 'list-row';
                mRow.innerHTML = <span><b>${c.name}</b>: ${c.phone}</span> <button class="btn-sm btn-del" id="del-sos-${i}">✕</button>;
                manage.appendChild(mRow);

                setTimeout(() => {
                    const delBtn = document.getElementById(del-sos-${i});
                    if(delBtn) {
                        delBtn.ontouchstart = (e) => { e.preventDefault(); delSOS(i); };
                        delBtn.onclick = () => delSOS(i);
                    }
                }, 50);
            });
            document.getElementById('sos-badge').innerText = sosContacts.length + " Contacts";
        }

        function addSOS() {
            const name = document.getElementById('new-sos-name').value.trim();
            const phone = document.getElementById('new-sos-phone').value.trim();
            if(!name || !phone) return alert("Enter contact name and number.");
            sosContacts.push({ name: name, phone: phone });
            document.getElementById('new-sos-name').value = '';
            document.getElementById('new-sos-phone').value = '';
            renderSOS();
        }

        function delSOS(i) {
            if(sosContacts.length <= 1) return alert("At least 1 contact required.");
            sosContacts.splice(i, 1);
            renderSOS();
        }

        function triggerSOSCall() {
            if(sosContacts.length === 0) return;
            const target = sosContacts[0];
            if(confirm(🚨 EMERGENCY SOS DISPATCH!\nCalling primary contact: ${target.name} (${target.phone}))) {
                window.location.href = tel:${target.phone};
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const ut = new SpeechSynthesisUtterance(text);
                ut.lang = currentLang;
                ut.rate = 0.85;
                window.speechSynthesis.speak(ut);
            } catch (e) {}
        }

        function startVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Voice recognition not supported in this browser.");

            const rec = new SpeechRecognition();
            rec.lang = currentLang;
            const inputField = document.getElementById('ai-input');
            inputField.placeholder = "Listening...";

            rec.onresult = function(e) {
                inputField.value = e.results[0][0].transcript;
                processAIRequest();
            };
            rec.onerror = function() { inputField.placeholder = "Ask health question..."; };
            rec.start();
        }

        async function processAIRequest() {
            const inputField = document.getElementById('ai-input');
            const query = inputField.value.trim();
            const out = document.getElementById('ai-output');
            
            if(!query) return alert("Please enter or speak a question.");

            const apiKey = profile.apiKey || localStorage.getItem('mg_gemini_key');

            if(apiKey) {
                out.innerText = "🤖 AI thinking...";
                const targetLang = currentLang === 'hi-IN' ? "Hindi" : (currentLang === 'ml-IN' ? "Malayalam" : "English");
                const systemPrompt = You are a rural healthcare advisor in Kerala. Give a brief, 2-sentence medical response in ${targetLang} for: ${query};

                try {
                    const response = await fetch(https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt }] }] })
                    });
                    const data = await response.json();
                    if(data.candidates && data.candidates[0].content.parts[0].text) {
                        const reply = data.candidates[0].content.parts[0].text.trim();
                        out.innerText = "🤖 " + reply;
                        speakText(reply);
                        return;
                    }
                } catch(e) {}
            }

            // Fallback Offline Medical Engine
            const q = query.toLowerCase();
            let res = "";

            if (currentLang === 'hi-IN') {
                if (q.includes('बुखार') || q.includes('fever')) res = "बुखार होने पर मरीज को आराम दें, माथे पर ठंडी पट्टी रखें और पैरासिटामोल दें। तापमान बढ़ने पर डॉक्टर से मिलें।";
                else if (q.includes('चक्कर') || q.includes('dizzy')) res = "मरीज को तुरंत छांव में बिठाएं और पानी दें। चक्कर बने रहने पर एसओएस बटन दबाएं।";
                else if (q.includes('দவா') || q.includes('pill')) res = "छूटी हुई दवा याद आते ही लें। यदि अगली खुराक का समय करीब है तो दोहरी खुराक न लें।";
                else res = "सलाह दर्ज की गई। मरीज को आराम कराएं और आवश्यकता होने पर नजदीकी प्राथमिक स्वास्थ्य केंद्र से संपर्क करें።";
            } else if (currentLang === 'ml-IN') {
                if (q.includes('പനി') || q.includes('fever')) res = "പനിയുള്ളപ്പോൾ രോഗിക്ക് വിശ്രമം നൽകുക, നെറ്റിയിൽ തണുത്ത വെള്ളം നനച്ച് വയ്ക്കുക. പനി കൂടിയാൽ ഡോക്ടറെ കാണുക.";
                else if (q.includes('തലചുറ്റൽ') || q.includes('dizzy')) res = "രോഗിയെ തണലിൽ ഇരുത്തി വെള്ളം നൽകുക. തലചുറ്റൽ തുടർന്നാൽ SOS അമർത്തുക.";
                else if (q.includes('മരുന്ന്') || q.includes('pill')) res = "വിട്ടുപോയ മരുന്ന് ഓർമ്മവരുമ്പോൾ കഴിക്കുക. അടുത്ത സമയമായാൽ ഇരട്ടി കഴിക്കരുത്.";
                else res = "രോഗിയെ ശാന്തമായി ഇരുത്തുക, ആവശ്യമെങ്കിൽ പ്രാഥമിക ആരോഗ്യ കേന്ദ്രവുമായി ബന്ധപ്പെടുക.";
            } else {
                if (q.includes('fever')) res = "For fever, ensure the patient rests, stays hydrated, and takes prescribed paracetamol. Consult a health worker if temperature persists.";
                else if (q.includes('dizzy') || q.includes('dizziness')) res = "Assist patient to sit in a shaded area and sip water. If persistent, trigger SOS.";
                else if (q.includes('missed') || q.includes('pill')) res = "Take missed medication as soon as remembered. Never double up doses.";
                else res = "Keep patient hydrated and calm. Contact primary health worker if symptoms persist.";
            }

            out.innerText = "🤖 " + res;
            speakText(res);
        }

        function simulateSpike() {
            document.getElementById('hr-display').innerText = "148 BPM";
            document.getElementById('bp-display').innerText = "165/105";
            document.getElementById('vitals-badge').innerText = "CRITICAL";
            document.getElementById('vitals-badge').className = "badge badge-red";
            
            let alertMsg = currentLang === 'hi-IN' ? "चेतावनी! उच्च रक्तचाप का पता चला!" : 
                          (currentLang === 'ml-IN' ? "മുന്നറിയിപ്പ്! ഉയർന്ന രക്തസമ്മർദ്ദം കണ്ടെത്തി!" : "Warning! Critical Blood Pressure spike detected!");
            document.getElementById('ai-output').innerText = "⚠️ " + alertMsg;
            speakText(alertMsg);
            alert(alertMsg);
        }

        async function pairBLE() {
            try {
                const d = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
                alert("Paired with: " + d.name);
            } catch(e) { alert("Bluetooth scan canceled."); }
        }
    </script>
