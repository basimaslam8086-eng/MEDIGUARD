<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEDIGUARD TOUCH DEBUG</title>
    <style>
        body { 
            background-color: #0B1120; 
            color: #FFF; 
            font-family: sans-serif; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .box { 
            background: #1E293B; 
            border: 2px solid #38BDF8; 
            padding: 20px; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            margin-bottom: 15px; 
        }
        button { 
            background: #38BDF8; 
            color: #000; 
            border: none; 
            padding: 16px 24px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 12px; 
            width: 100%; 
            cursor: pointer; 
            margin-top: 10px; 
        }
    </style>
</head>
<body>

    <h1>🛠️ Touch Debug Mode</h1>

    <div class="box">
        <h3>Test Button 1</h3>
        <p>Tests basic inline touch & click handling.</p>
        <button onclick="alert('Button 1 Touched Successfully!');" ontouchstart="alert('Button 1 TouchStart Triggered!');">TAP ME 1</button>
    </div>

    <div class="box">
        <h3>Test Button 2 (AI Simulation)</h3>
        <p>Tests input writing and response simulation.</p>
        <input type="text" id="test-input" value="Fever" style="width:100%; padding:12px; margin-top:10px; background:#0F172A; color:#fff; border:1px solid #334155; border-radius:8px;">
        <button onclick="runTestAI()" style="background: #22C55E; color: white;">RUN AI TEST</button>
        <p id="test-output" style="margin-top: 10px; color: #38BDF8; font-weight: bold;">Output: Waiting...</p>
    </div>

    <script>
        function runTestAI() {
            const val = document.getElementById('test-input').value;
            document.getElementById('test-output').innerText = "Output: AI received -> " + val;
            alert("AI Engine Triggered with query: " + val);
        }
    </script>
</body>
</html>
